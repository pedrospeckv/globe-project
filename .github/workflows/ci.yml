# Confere todo PR e todo push no master.
#
# A ordem dos passos é deliberada: o mais barato e o mais informativo primeiro.
# `validar` é o que mais interessa a quem contribui com conteúdo — ele responde
# "a sua alegação tem fonte?" em segundos, sem esperar build de mapa nenhum.
name: CI

on:
  pull_request:
  push:
    branches: [master]

# PR que recebe outro commit cancela a execução anterior: ninguém precisa do
# resultado de um commit que já foi substituído.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Conteúdo primeiro: é o passo que a maioria dos PRs vai exercitar, e o
      # único cuja mensagem de erro é endereçada a quem escreve, não a quem
      # programa. Diz o arquivo, o campo e o que falta.
      - name: Conteúdo — schema, fontes e ligações
        run: pnpm validar

      # `LayoutProps`, `PageProps` e companhia são GERADAS pelo Next a partir das
      # rotas, e vivem em `.next/types/`, que não é versionado. Numa máquina de
      # desenvolvimento elas já estão lá porque alguém rodou `dev` ou `build`; em
      # checkout novo não existem, e o `tsc` reprovou com `Cannot find name
      # 'LayoutProps'` na primeira execução deste workflow. `typegen` as produz sem
      # pagar um build inteiro.
      - name: Tipos gerados das rotas
        run: pnpm exec next typegen

      - name: Tipos
        run: pnpm exec tsc --noEmit

      - name: Testes
        run: pnpm test

      - name: Lint
        run: pnpm lint

      # O build roda por último porque é o mais caro e o que menos acrescenta
      # depois dos anteriores — mas roda, porque é ele que gera as 136 páginas
      # estáticas e é onde erro de link entre dossiês aparece.
      - name: Build
        run: pnpm build

  # Trabalho separado, e não mais um passo do anterior, por três razões: depende
  # de REDE, e nada mais aqui depende; leva cerca de dois minutos, que não devem
  # atrasar a resposta sobre schema e tipos; e falha por motivo de outra natureza
  # — um 404 não é código quebrado, é fonte que não existe.
  #
  # Reprova só em 404 e 410. Barreira de robô e limite de taxa saem como aviso,
  # porque acusar um contribuinte de inventar fonte que existe custa mais caro
  # que deixar passar um link que ninguém conseguiu conferir.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # O cache guarda o que já respondeu, com data. Sem ele, todo PR bateria
      # nos mesmos 391 endereços do Commons — e é a Wikimedia que paga essa
      # conta, não este repositório.
      - name: Cache dos endereços já conferidos
        uses: actions/cache@v4
        with:
          path: .cache/links.json
          key: links-${{ github.run_id }}
          restore-keys: links-

      - name: Endereços — os que o acervo cita existem?
        run: pnpm conferir-links
